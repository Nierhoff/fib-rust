name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  CARGO_PGO_VERSION: "0.3.0"
  CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ \
            pkg-config \
            libx11-dev \
            libasound2-dev \
            libudev-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libxkbcommon-dev \
            gcc-mingw-w64-x86-64 \
            zip

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
          targets: x86_64-pc-windows-gnu, x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  release:
    name: Windows release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ \
            pkg-config \
            libx11-dev \
            libasound2-dev \
            libudev-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libxkbcommon-dev \
            gcc-mingw-w64-x86-64 \
            wine \
            zip

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
          targets: x86_64-pc-windows-gnu, x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Verify release tag matches Cargo version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "fib-rust") | .version')

          echo "Tag version:   $TAG_VERSION"
          echo "Cargo version: $CARGO_VERSION"

          test "$TAG_VERSION" = "$CARGO_VERSION"

      - name: Build native CPU Linux release
        env:
          RUSTFLAGS: "-C target-cpu=native"
        run: cargo build --release --bin fib-rust

      - name: Package native CPU Linux release
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ github.ref_name }}"
          package_name="fib-rust-$tag-linux-native"
          package_dir="dist/$package_name"

          mkdir -p "$package_dir"

          cp target/release/fib-rust "$package_dir/"

          if [[ -d assets ]]; then
            cp -r assets "$package_dir/assets"
          fi

          test -f "$package_dir/fib-rust"
          (
            cd dist
            zip -r "$package_name.zip" "$package_name"
          )

      - name: Install cargo-pgo
        run: cargo install cargo-pgo --version "$CARGO_PGO_VERSION" --locked

      - name: Build PGO-instrumented Windows release
        run: cargo pgo build -- --target x86_64-pc-windows-gnu --bin fib-rust

      - name: Gather Windows PGO profile
        shell: bash
        env:
          WINEDEBUG: -all
        run: wine target/x86_64-pc-windows-gnu/release/fib-rust.exe

      - name: Build PGO-optimized Windows release
        run: cargo pgo optimize build -- --target x86_64-pc-windows-gnu --bin fib-rust

      - name: Package Windows release
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ github.ref_name }}"
          package_name="fib-rust-$tag-windows"
          target_dir="target/x86_64-pc-windows-gnu/release"
          package_dir="dist/$package_name"

          mkdir -p "$package_dir"

          cp "$target_dir/fib-rust.exe" "$package_dir/"

          find "$target_dir" -maxdepth 2 -type f -iname "*.dll" \
            -exec cp -f {} "$package_dir/" \;
          
          if [[ -d assets ]]; then
            cp -r assets "$package_dir/assets"
          fi

          test -f "$package_dir/fib-rust.exe"
          (
            cd dist
            zip -r "$package_name.zip" "$package_name"
          )

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          windows_zip_path="dist/fib-rust-$tag-windows.zip"
          linux_native_zip_path="dist/fib-rust-$tag-linux-native.zip"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "$windows_zip_path" \
              "$linux_native_zip_path" \
              --clobber
          else
            gh release create "$tag" \
              "$windows_zip_path" \
              "$linux_native_zip_path" \
              --title "$tag" \
              --notes "Automated release for $tag." \
              --verify-tag
          fi
